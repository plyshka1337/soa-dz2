name: soa-dz2
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: flyway/flyway:11
    command: ["-url=jdbc:postgresql://db:5432/marketplace", "-user=marketplace", "-password=marketplace", "-connectRetries=30", "migrate"]
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@db:5432/marketplace
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-before-deployment-32bytes}
      ORDER_LIMIT_MINUTES: ${ORDER_LIMIT_MINUTES:-1}
    ports:
      - "8012:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
